name: rfid
description: RFID inventory app for Chainway UHF handhelds (inventory, tag marking, movement).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation and dependency injection
  go_router: ^14.8.0
  get_it: ^8.0.3

  # Network
  dio: ^5.8.0+1

  # Local storage
  hive: ^2.2.3
  path_provider: ^2.1.5

  # Localization (used by the generated l10n classes)
  intl: ^0.20.0

  # Icon font referenced by Flutter's own Cupertino widgets
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/logo/app_logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_logo.png"

  min_sdk_android: 21

flutter:
  uses-material-design: true
  # Generates the l10n classes from lib/core/l10n/arb (see l10n.yaml).
  generate: true

  assets:
    - assets/logo/
